<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NekoCode Desktop — 宣传片</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/*
 * NekoCode Desktop promo — every frame is drawn on a 1920×1080 canvas from a
 * single time value, so seeking, pausing and looping are exact. The soundtrack
 * is synthesized once with OfflineAudioContext and played in sync.
 *
 * Keys: Space play/pause · ←/→ seek 3s · R restart · M mute · F fullscreen · L language
 * URL:  ?lang=en  ?t=12 (open paused at 12s)  ?autoplay=1  ?loop=1  ?ui=0 (hide controls, for screen capture)
 */

const W = 1920, H = 1080, DUR = 52;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const qs = new URLSearchParams(location.search);
let LANG = qs.get('lang') === 'en' ? 'en' : 'zh';
const T = (zh, en) => (LANG === 'en' ? en : zh);

const SANS = '"SF Pro Display","SF Pro Text","Segoe UI Variable Display","Segoe UI","PingFang SC","HarmonyOS Sans SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif';
const MONO = '"SF Mono","JetBrains Mono",Menlo,Consolas,"Cascadia Mono",monospace';
const INK = '#1d1d1f', MUTED = '#86868b', BG = '#fbfbfd';
const LAV = '#8b5cf6', LAV_SOFT = '#a78bfa', GREEN = '#34c759', RED = '#ff3b30';
const BRAND = ['#5b5bf7', '#9b6bff', '#e879c9'];

// ───────────────────────── math & easing ─────────────────────────
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const P = (t, a, d) => clamp((t - a) / d);
const lerp = (a, b, x) => a + (b - a) * x;
const eOut = x => 1 - Math.pow(1 - x, 3);
const eIn = x => x * x * x;
const eIO = x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const expo = x => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const spring = x => (x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.exp(-7 * x) * Math.cos(8 * x));

function mulberry32(a) {
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mixC = (a, b, m) => {
  const A = hex(a), B = hex(b);
  return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * m)).join(',')})`;
};

// ───────────────────────── drawing helpers ─────────────────────────
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, Math.PI * 2); }

function setFont(size, weight, font = SANS, ls = 0) {
  ctx.font = `${weight} ${size}px ${font}`;
  ctx.letterSpacing = ls + 'px';
}
function tw(s, size, weight, font = SANS, ls = 0) { setFont(size, weight, font, ls); return ctx.measureText(s).width; }
function txt(s, x, y, o = {}) {
  const { size = 48, weight = 600, color = INK, align = 'center', font = SANS, ls = 0, baseline = 'alphabetic' } = o;
  setFont(size, weight, font, ls);
  ctx.textAlign = align; ctx.textBaseline = baseline; ctx.fillStyle = color;
  // Full-width 。， end in blank space; nudge right so centred lines look centred.
  ctx.fillText(s, align === 'center' && /[。，]$/.test(s) ? x + size * 0.25 : x, y);
}
function gradH(x0, x1, stops = BRAND) {
  const g = ctx.createLinearGradient(x0, 0, x1, 0);
  stops.forEach((c, i) => g.addColorStop(i / (stops.length - 1), c));
  return g;
}
// Mixed-style line: parts = [{ t, color | 'brand', weight }]
function rich(parts, x, y, { size = 100, weight = 800, align = 'center', ls = 0, baseline = 'alphabetic' } = {}) {
  const ws = parts.map(p => tw(p.t, size, p.weight ?? weight, SANS, ls));
  // Full-width 。，end in blank space; ignore it so centred lines look centred.
  const total = ws.reduce((a, b) => a + b, 0) - (/[。，]$/.test(parts[parts.length - 1].t) ? size * 0.5 : 0);
  let cx = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
  parts.forEach((p, i) => {
    const color = p.color === 'brand' ? gradH(cx, cx + ws[i]) : (p.color ?? INK);
    txt(p.t, cx, y, { size, weight: p.weight ?? weight, color, align: 'left', ls, baseline });
    cx += ws[i];
  });
  return total;
}
function wrap(s, maxW, size, weight) {
  const words = /\s/.test(s) ? s.split(/(?<=\s)/) : Array.from(s);
  const lines = []; let cur = '';
  for (const w of words) {
    if (cur && tw(cur + w, size, weight) > maxW) { lines.push(cur.trimEnd()); cur = w.trimStart(); }
    else cur += w;
  }
  if (cur) lines.push(cur);
  return lines;
}
// Apply alpha / offset / scale / blur around an origin for everything drawn in fn.
function fx(o, fn) {
  const { alpha = 1, x = 0, y = 0, s = 1, sx, sy, ox = W / 2, oy = H / 2, blur = 0 } = o;
  if (alpha <= 0.002) return;
  ctx.save();
  ctx.globalAlpha *= clamp(alpha);
  ctx.translate(ox + x, oy + y);
  ctx.scale(sx ?? s, sy ?? s);
  ctx.translate(-ox, -oy);
  if (blur > 0.3) ctx.filter = `blur(${blur.toFixed(1)}px)`;
  fn();
  ctx.restore();
}
// Apple-style text reveal: rise + unblur in, lift + blur out.
function rv(t, t0, tOut = 1e9, o = {}) {
  const { dur = 0.9, dy = 40, blur = 12, outDur = 0.4, outDy = -24, s0 = 1 } = o;
  const a = expo(P(t, t0, dur)), b = eIO(P(t, tOut, outDur));
  return { alpha: eOut(P(t, t0, dur * 0.5)) * (1 - b), y: dy * (1 - a) + outDy * b, blur: blur * (1 - a) + 8 * b, s: lerp(s0, 1, a) };
}
function spinner(cx, cy, r, color, t, lw = 2) {
  ctx.save();
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round';
  const a = t * 7;
  ctx.beginPath(); ctx.arc(cx, cy, r, a, a + Math.PI * 1.4); ctx.stroke();
  ctx.restore();
}
function check(cx, cy, s, color, lw, prog = 1) {
  ctx.save();
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const len = s * 1.45;
  ctx.setLineDash([len * prog, len * 2]);
  ctx.beginPath();
  ctx.moveTo(cx - s * 0.5, cy); ctx.lineTo(cx - s * 0.15, cy + s * 0.35); ctx.lineTo(cx + s * 0.5, cy - s * 0.35);
  ctx.stroke();
  ctx.restore();
}
function strokePartial(pts, frac, color, lw) {
  const n = Math.max(1, Math.floor((pts.length - 1) * clamp(frac)));
  if (frac <= 0) return;
  ctx.save();
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i <= n; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.stroke();
  ctx.restore();
}
const cubic = (p0, p1, p2, p3, n = 60) => Array.from({ length: n + 1 }, (_, i) => {
  const u = i / n, v = 1 - u;
  return [0, 1].map(k => v * v * v * p0[k] + 3 * v * v * u * p1[k] + 3 * v * u * u * p2[k] + u * u * u * p3[k]);
});

// ───────────────────────── the cat (vector, 1024 design units) ─────────────────────────
const CAT = {
  head: new Path2D('M 222 700 C 200 470 330 345 512 345 C 694 345 824 470 802 700 Z'),
  ear: new Path2D('M 238 540 C 214 440 204 336 222 292 C 232 268 262 266 284 278 C 332 304 382 336 420 364 Z'),
  inner: new Path2D('M 262 452 C 250 400 246 350 258 330 C 268 318 296 326 350 362 C 310 380 280 410 262 452 Z'),
  nose: new Path2D('M 482 630 Q 512 622 542 630 Q 548 634 542 642 L 520 670 Q 512 680 504 670 L 482 642 Q 476 634 482 630 Z'),
  whiskers: ['M 250 520 Q 170 500 100 506', 'M 238 572 Q 150 562 62 574', 'M 240 622 Q 170 622 98 642'].map(d => new Path2D(d)),
  paw: (() => {
    const p = new Path2D();
    p.ellipse(245, 702, 98, 62, 0, 0, Math.PI * 2);
    [[188, 748, 34], [245, 760, 36], [302, 748, 34]].forEach(([x, y, r]) => { p.moveTo(x + r, y); p.arc(x, y, r, 0, Math.PI * 2); });
    return p;
  })(),
};
function mirrored(fn) {
  fn();
  ctx.save(); ctx.translate(1024, 0); ctx.scale(-1, 1); fn(); ctx.restore();
}
/**
 * eye: 0 closed … 1 open · px: pupil glance −1…1 · accentA: ear/nose opacity
 * outline: colour of the gap around the paws (the background) · glow: eye glow 0…1
 */
function drawCat(cx, cy, w, o = {}) {
  const { eye = 1, px = 0, body = '#1b1a21', accent = LAV_SOFT, accentA = 1, outline = '#fff', outlineA = 1, glow = 0 } = o;
  const k = w / 1024;
  ctx.save();
  ctx.translate(cx, cy); ctx.scale(k, k); ctx.translate(-512, -528);
  const base = ctx.globalAlpha;
  ctx.lineCap = 'round';
  mirrored(() => {
    ctx.strokeStyle = body; ctx.lineWidth = 20;
    CAT.whiskers.forEach(p => ctx.stroke(p));
    ctx.fillStyle = body; ctx.fill(CAT.ear);
  });
  ctx.fillStyle = body; ctx.fill(CAT.head);
  if (accentA > 0) {
    ctx.globalAlpha = base * accentA;
    ctx.fillStyle = accent;
    mirrored(() => ctx.fill(CAT.inner));
    ctx.fill(CAT.nose);
    ctx.globalAlpha = base;
  }
  if (eye > 0.01) {
    for (const ex of [392, 632]) {
      ctx.save();
      ctx.translate(ex, 580); ctx.scale(1, eye);
      if (glow > 0) { ctx.shadowColor = `rgba(255,255,255,${0.55 * glow})`; ctx.shadowBlur = 40 * glow; }
      ctx.fillStyle = '#fff'; circle(0, 0, 76); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = body; ctx.beginPath(); ctx.ellipse(px * 24, 0, 18, 50, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }
  mirrored(() => {
    if (outlineA > 0) {
      ctx.globalAlpha = base * outlineA;
      ctx.strokeStyle = outline; ctx.lineWidth = 24; ctx.stroke(CAT.paw);
      ctx.globalAlpha = base;
    }
    ctx.fillStyle = body; ctx.fill(CAT.paw);
    if (outlineA > 0) {
      ctx.globalAlpha = base * outlineA;
      ctx.strokeStyle = outline; ctx.lineWidth = 10;
      ctx.beginPath(); ctx.moveTo(216, 742); ctx.lineTo(216, 772); ctx.moveTo(274, 742); ctx.lineTo(274, 772); ctx.stroke();
      ctx.globalAlpha = base;
    }
  });
  ctx.restore();
}
const blinkAt = (t, t0, d = 0.24) => (t > t0 && t < t0 + d ? Math.sin(Math.PI * (t - t0) / d) : 0);

// ───────────────────────── scene 1 · eyes in the dark (0 – 4) ─────────────────────────
function s1(t) {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const reveal = eIO(P(t, 1.95, 0.8));
  if (reveal > 0) { ctx.fillStyle = BG; circle(960, 500, reveal * 2300); ctx.fill(); }

  const move = eIO(P(t, 2.55, 0.8));
  const open = expo(P(t, 0.35, 0.7)) * (1 - 0.92 * blinkAt(t, 1.55));
  const px = -eIO(P(t, 0.95, 0.25)) + 2 * eIO(P(t, 1.2, 0.3)) - eIO(P(t, 1.62, 0.3));
  const out = eIO(P(t, 3.6, 0.4));
  fx({ alpha: 1 - out, y: -30 * out, blur: 8 * out, ox: 960, oy: 440 }, () => {
    drawCat(960, lerp(500, 430, move), lerp(720, 460, move), {
      eye: open, px, body: '#17161d',
      accentA: eOut(P(t, 1.3, 0.6)),
      outline: BG, outlineA: clamp(reveal * 5),
      glow: 1 - reveal,
    });
  });
  const r = rv(t, 2.95, 3.55);
  fx({ ...r, ox: 960, oy: 690 }, () => {
    rich([{ t: T('认识 ', 'Meet ') }, { t: 'NekoCode', color: INK }, { t: T('。', '.') }], 960, 700, { size: 96, weight: 700, ls: -1 });
  });
}

// ───────────────────────── scene 2 · kinetic words (4 – 7.5) ─────────────────────────
function s2(t) {
  const words = [
    [4.0, T('写代码。', 'Write.'), BG, INK],
    [4.75, T('修 Bug。', 'Debug.'), '#0a0a0c', '#fff'],
    [5.5, T('发布上线。', 'Ship.'), '#7c5cff', '#fff'],
  ];
  if (t < 6.25) {
    let i = 0;
    while (i < words.length - 1 && t >= words[i + 1][0]) i++;
    const [t0, word, bg, fg] = words[i];
    const lt = t - t0;
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    fx({
      alpha: eOut(clamp(lt / 0.18)),
      s: lerp(1.22, 1, expo(clamp(lt / 0.5))) * (1 + lt * 0.03),
      blur: lerp(22, 0, expo(clamp(lt / 0.35))),
      ox: 960, oy: 540,
    }, () => rich([{ t: word, color: fg }], 960, 540, { size: 240, weight: 800, ls: -6, baseline: 'middle' }));
    return;
  }
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  const r = rv(t, 6.25, 7.1, { s0: 0.96 });
  fx({ ...r, ox: 960, oy: 540 }, () => {
    rich(LANG === 'en'
      ? [{ t: 'All in ' }, { t: 'one conversation.', color: 'brand' }]
      : [{ t: '一次对话，' }, { t: '全部搞定。', color: 'brand' }],
      960, 540, { size: 124, weight: 800, ls: -3, baseline: 'middle' });
  });
}

// ───────────────────────── scene 3 · the app at work (7.5 – 14.4) ─────────────────────────
// The app scenes mirror the real NekoCode window: layout, sizes and colours are the app's
// own CSS values (a 1040×640 CSS-px window drawn at 1.25×); icons are the Tabler, Central,
// VS Code and Simple Icons paths the app ships.
const UI = '-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"PingFang SC","Microsoft YaHei",sans-serif';
const UI_MONO = '"JetBrains Mono Variable","JetBrains Mono","SF Mono",Menlo,Consolas,"Cascadia Mono",monospace';

  ctx.fillStyle = INK; rr(cx - 70, sy + sh - 14, 140, 5, 3); ctx.fill();
  ctx.restore();
  ctx.fillStyle = '#000'; rr(x + w / 2 - 62, sy + 12, 124, 36, 18); ctx.fill();
}
function s6(t) {
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  const out = 26.1;
  const size = LANG === 'en' ? 108 : 124;
  fx({ ...rv(t, 22.85, out), ox: 240, oy: 430 }, () => txt(T('你的工位，', 'Your desk,'), 230, 450, { size, weight: 800, align: 'left', ls: -3 }));
  fx({ ...rv(t, 23.0, out), ox: 240, oy: 570 }, () => {
    const s = T('装进口袋。', 'in your pocket.');
    const w = tw(s, size, 800, SANS, -3);
    txt(s, 230, 590, { size, weight: 800, align: 'left', ls: -3, color: gradH(230, 230 + w) });
  });
  fx({ ...rv(t, 23.3, out), ox: 240, oy: 680 }, () =>
    txt(T('扫码配对，随时随地新建、查看任务。', 'Pair with a scan. Start and follow tasks anywhere.'), 232, 690, { size: 32, weight: 500, color: MUTED, align: 'left' }));
  fx({ ...rv(t, 23.5, out), ox: 240, oy: 760 }, () => {
    let cx = 232;
    ['Android', 'iOS', T('局域网直连', 'LAN direct')].forEach(label => {
      const w = tw(label, 20, 600) + 40;
      ctx.strokeStyle = '#d2d2d7'; ctx.lineWidth = 1.5; rr(cx, 740, w, 44, 22); ctx.stroke();
      txt(label, cx + w / 2, 769, { size: 20, weight: 600, color: INK });
      cx += w + 12;
    });
  });
  const e = expo(P(t, 22.7, 1.1));
  const o = eIO(P(t, out, 0.4));
  fx({ alpha: eOut(P(t, 22.7, 0.3)) * (1 - o), y: lerp(760, 0, e) + 60 * o, ox: 1460, oy: 540 }, () => drawPhone(t, 1260, 130));
}

// ───────────────────────── scene 7 · logo (26.5 – 30) ─────────────────────────
function s7(t) {
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  const a = spring(P(t, 26.7, 1.0));
  fx({ alpha: eOut(P(t, 26.7, 0.3)), s: lerp(0.6, 1, a), ox: 960, oy: 400 }, () => {
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.13)'; ctx.shadowBlur = 70; ctx.shadowOffsetY = 24;
    ctx.fillStyle = '#fff'; rr(830, 270, 260, 260, 58); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = '#ececf0'; ctx.lineWidth = 1; rr(830, 270, 260, 260, 58); ctx.stroke();
    const px = -eIO(P(t, 28.2, 0.3)) + eIO(P(t, 28.55, 0.3));
    drawCat(960, 406, 214, { eye: 1 - 0.92 * blinkAt(t, 28.95), px });
  });
  fx({ ...rv(t, 27.15), ox: 960, oy: 660 }, () =>
    rich([{ t: 'NekoCode', weight: 800 }, { t: ' Desktop', weight: 300, color: MUTED }], 960, 690, { size: 108, ls: -2 }));
  fx({ ...rv(t, 27.55), ox: 960, oy: 760 }, () =>
    rich([{ t: T('一起构建下一个未来。', 'Build what’s next, together.'), color: 'brand' }], 960, 782, { size: 52, weight: 700, ls: -1 }));
  fx({ ...rv(t, 28.0, 1e9, { dy: 20 }), ox: 960, oy: 900 }, () =>
    txt('Windows  ·  macOS  ·  Linux  ·  Android  ·  iOS', 960, 910, { size: 22, weight: 600, color: '#a1a1a6', ls: 3 }));
  const fade = eIO(P(t, 29.3, 0.7));
  if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${fade})`; ctx.fillRect(0, 0, W, H); }
}

// [start, end, scene, offset]: a scene is drawn with t − offset, so scenes keep their own clocks.
const SCENES = [
  [0, 4.0, s1, 0], [4.0, 7.5, s2, 0], [7.5, 14.4, s3, 0], [14.4, 21.4, sBrowser, 14.4],
  [21.4, 25.4, s4, 7], [25.4, 30.4, sParallel, 25.4], [30.4, 35.4, sRewind, 30.4], [35.4, 40.4, sIde, 35.4],
  [40.4, 44.6, s5, 22], [44.6, 48.5, s6, 22], [48.5, DUR, s7, 22],
];
function drawFrame(t) {
  if (t >= DUR) { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); return; }
  for (const [a, b, fn, off] of SCENES) if (t >= a && t < b) { fn(t - off); break; }
}

// ───────────────────────── soundtrack (synthesized) ─────────────────────────
async function buildAudio() {
  const SR = 44100;
  const ac = new OfflineAudioContext(2, Math.ceil(SR * (DUR + 1)), SR);
  const master = ac.createGain();
  master.gain.setValueAtTime(0.9, 0); master.gain.setValueAtTime(0.9, DUR - 0.8); master.gain.linearRampToValueAtTime(0, DUR + 0.2);
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -16; comp.knee.value = 12; comp.ratio.value = 3; comp.attack.value = 0.005; comp.release.value = 0.2;
  master.connect(comp); comp.connect(ac.destination);

  const ir = ac.createBuffer(2, SR * 3, SR);
  for (let ch = 0; ch < 2; ch++) {
    const d = ir.getChannelData(ch), rnd = mulberry32(11 + ch);
    for (let i = 0; i < d.length; i++) d[i] = (rnd() * 2 - 1) * Math.pow(1 - i / d.length, 3.5);
  }
  const rev = ac.createConvolver(); rev.buffer = ir;
  const revOut = ac.createGain(); revOut.gain.value = 0.45; rev.connect(revOut); revOut.connect(master);

  const noise = ac.createBuffer(1, SR * 2, SR);
  { const d = noise.getChannelData(0), rnd = mulberry32(3); for (let i = 0; i < d.length; i++) d[i] = rnd() * 2 - 1; }

  const bus = (node, dry, wet) => {
    if (dry) { const g = ac.createGain(); g.gain.value = dry; node.connect(g); g.connect(master); }
    if (wet) { const g = ac.createGain(); g.gain.value = wet; node.connect(g); g.connect(rev); }
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  const osc = (type, f, t0, t1) => { const o = ac.createOscillator(); o.type = type; o.frequency.value = f; o.start(t0); o.stop(t1); return o; };
  const noiseSrc = (t0, dur) => { const s = ac.createBufferSource(); s.buffer = noise; s.loop = true; s.start(t0); s.stop(t0 + dur); return s; };

  function pad(t, dur, notes, lvl) {
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1300; f.Q.value = 0.3;
    const g = ac.createGain();
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(lvl, t + Math.min(0.9, dur * 0.4));
    g.gain.setValueAtTime(lvl, t + dur); g.gain.linearRampToValueAtTime(0, t + dur + 1);
    f.connect(g); bus(g, 1, 0.6);
    notes.forEach(n => [-7, 7].forEach(dt => {
      const o = osc('sawtooth', hz(n), t, t + dur + 1.05); o.detune.value = dt;
      const og = ac.createGain(); og.gain.value = 1 / (notes.length * 2); o.connect(og); og.connect(f);
    }));
  }
  function kick(t, lvl) {
    const o = osc('sine', 150, t, t + 0.45);
    o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.13);
    const g = ac.createGain(); g.gain.setValueAtTime(lvl, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.42);
    o.connect(g); bus(g, 1, 0);
  }
  function hat(t, lvl) {
    const s = noiseSrc(t, 0.07);
    const f = ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 7500;
    const g = ac.createGain(); g.gain.setValueAtTime(lvl, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
    s.connect(f); f.connect(g); bus(g, 1, 0.1);
  }
  function snap(t, lvl) {
    const s = noiseSrc(t, 0.25);
    const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1600; f.Q.value = 0.8;
    const g = ac.createGain(); g.gain.setValueAtTime(lvl, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
    s.connect(f); f.connect(g); bus(g, 1, 0.4);
  }
  function pluck(t, m, lvl, dec = 0.4) {
    const f = ac.createBiquadFilter(); f.type = 'lowpass';
    f.frequency.setValueAtTime(4200, t); f.frequency.exponentialRampToValueAtTime(600, t + dec);
    const g = ac.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(lvl, t + 0.005); g.gain.exponentialRampToValueAtTime(0.001, t + dec);
    osc('triangle', hz(m), t, t + dec + 0.05).connect(f);
    const sq = osc('square', hz(m), t, t + dec + 0.05); const sg = ac.createGain(); sg.gain.value = 0.25; sq.connect(sg); sg.connect(f);
    f.connect(g); bus(g, 1, 0.35);
  }
  function bell(t, m, lvl, dec = 2.5) {
    [[1, 1], [2, 0.4], [3.01, 0.2], [4.17, 0.12]].forEach(([r, a], k) => {
      const g = ac.createGain();
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(lvl * a, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + dec / (1 + k * 0.6));
      osc('sine', hz(m) * r, t, t + dec + 0.1).connect(g); bus(g, 1, 0.6);
    });
  }
  function sub(t, m, dur, lvl) {
    const g = ac.createGain();
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(lvl, t + 0.02); g.gain.setValueAtTime(lvl, t + dur); g.gain.linearRampToValueAtTime(0, t + dur + 0.3);
    osc('sine', hz(m), t, t + dur + 0.35).connect(g); bus(g, 1, 0);
  }
  function whoosh(t, dur, lvl) {
    const s = noiseSrc(t, dur + 0.25);
    const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.2;
    f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(6000, t + dur);
    const g = ac.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(lvl, t + dur * 0.85); g.gain.linearRampToValueAtTime(0, t + dur + 0.2);
    s.connect(f); f.connect(g); bus(g, 1, 0.5);
  }
  function blip(t, f0, f1, lvl) {
    const o = osc('sine', f0, t, t + 0.15);
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + 0.08);
    const g = ac.createGain(); g.gain.setValueAtTime(lvl, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
    o.connect(g); bus(g, 1, 0.3);
  }

  function tapeStop(t, dur, lvl) {
    const o = osc('sawtooth', 220, t, t + dur + 0.05);
    o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(30, t + dur);
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 900;
    const g = ac.createGain(); g.gain.setValueAtTime(lvl, t); g.gain.linearRampToValueAtTime(0, t + dur);
    o.connect(f); f.connect(g); bus(g, 1, 0.3);
  }

  // 120 BPM, one chord per 2 s bar: Dmaj9 – Bm11 – Gmaj9 – Aadd9
  const CHORDS = [[50, 54, 57, 61, 64], [47, 50, 54, 57, 64], [43, 47, 50, 54, 57], [45, 52, 57, 59, 61]];
  const BASS = [38, 35, 31, 33];
  const OUTRO = 48.5;
  const HALF = [30.4, 35.4]; // checkpoints: half-time breakdown
  for (let bar = 0; bar * 2 + 2 <= OUTRO + 0.01; bar++) {
    const t = bar * 2, c = bar % 4;
    pad(t, 2, CHORDS[c], t < 4 ? 0.09 : t < 8 ? 0.07 : 0.055);
    if (t >= 8) sub(t, BASS[c], 1.8, 0.16);
  }
  // intro
  blip(0.35, 400, 800, 0.05); blip(1.55, 1500, 1100, 0.02);
  whoosh(1.2, 0.75, 0.12);
  bell(2.0, 74, 0.07); bell(2.0, 81, 0.04); sub(2.0, 38, 1.5, 0.12);
  // kinetic words
  [[4.0, 38], [4.75, 35], [5.5, 43]].forEach(([t, b]) => { kick(t, 0.9); sub(t, b, 0.5, 0.18); snap(t, 0.22); });
  CHORDS[0].forEach(n => pluck(6.25, n + 12, 0.06, 0.8));
  whoosh(6.9, 0.6, 0.1);
  // groove
  let step = 0;
  const ARP = [0, 2, 4, 3, 1, 3, 4, 2];
  for (let b = 8; b < OUTRO; b += 0.5) {
    const half = b >= HALF[0] && b < HALF[1];
    if (!half || b % 1 === 0) kick(b, half ? 0.4 : 0.55);
    if (!half) hat(b + 0.25, 0.09);
    if (b >= 10) {
      const chord = CHORDS[Math.floor(b / 2) % 4];
      for (const off of [0, 0.25]) pluck(b + off, chord[ARP[step++ % 8]] + 12, half ? 0.028 : 0.045);
    }
  }
  [13.8, 20.8, 24.8, 29.8, 34.8, 39.8, 44.0].forEach(t => whoosh(t, 0.6, 0.1));
  // app demo
  blip(10.15, 900, 1400, 0.06);
  [11.3, 11.6, 11.9].forEach(t => blip(t, 1200, 1500, 0.03));
  bell(13.4, 81, 0.05);
  // browser preview
  blip(16.35, 900, 1300, 0.05);
  blip(17.55, 1300, 1800, 0.05); bell(17.6, 86, 0.03);
  blip(18.85, 900, 1400, 0.06);
  blip(19.4, 1200, 1500, 0.03);
  bell(20.1, 81, 0.06);
  // parallel tasks: a rising note as each branch merges
  for (let i = 0; i < 4; i++) blip(26.0 + i * 0.12, 1300 + i * 80, 1600 + i * 80, 0.03);
  [[28.6, 76], [29.3, 79], [29.8, 83]].forEach(([t, n]) => bell(t, n, 0.06));
  // checkpoints
  blip(32.35, 1000, 1400, 0.05);
  blip(33.35, 900, 1300, 0.05);
  tapeStop(33.6, 0.7, 0.07);
  bell(34.3, 74, 0.06);
  // Agent ⇄ IDE
  blip(36.9, 1000, 1500, 0.05); whoosh(36.8, 0.5, 0.08);
  blip(38.6, 1200, 1500, 0.04);
  bell(39.3, 81, 0.05);
  // bento and phone
  for (let i = 0; i < 6; i++) blip(40.6 + i * 0.09, 1300 + i * 80, 1600 + i * 80, 0.035);
  bell(46.4, 83, 0.07); bell(46.52, 88, 0.06);
  blip(47.62, 1100, 1500, 0.04);
  // outro
  kick(48.7, 0.8); sub(48.7, 38, 2.5, 0.2);
  [74, 78, 81].forEach(n => bell(48.7, n, 0.07, 3.5));
  pad(48.7, 3.0, CHORDS[0], 0.08);
  blip(50.95, 1800, 1200, 0.02);

  return ac.startRendering();
}

// ───────────────────────── player ─────────────────────────
let actx = null, audioBuf = null, src = null, gainNode = null, muted = false;
const audioReady = buildAudio().then(b => (audioBuf = b)).catch(() => null);
let playing = false, started = false, ended = false;
let offset = clamp(parseFloat(qs.get('t')) || 0, 0, DUR);
let clockBase = 0, perfBase = 0;
let lastMove = -1e9;
if (qs.has('t')) started = true;

function now() {
  if (!playing) return offset;
  if (src && actx) return offset + (actx.currentTime - clockBase);
  return offset + (performance.now() - perfBase) / 1000;
}
let starting = false;
async function play() {
  if (playing || starting) return;
  if (offset >= DUR) offset = 0;
  started = true; ended = false; starting = true;
  try {
    actx ??= new AudioContext();
    gainNode ??= actx.createGain();
    gainNode.gain.value = muted ? 0 : 1;
    gainNode.connect(actx.destination);
    await actx.resume();
    await audioReady;
  } catch { /* play silently */ }
  if (audioBuf && actx) {
    src = actx.createBufferSource(); src.buffer = audioBuf; src.connect(gainNode);
    clockBase = actx.currentTime + 0.03;
    src.start(clockBase, offset);
  }
  perfBase = performance.now();
  playing = true; starting = false;
}
function pause() {
  if (!playing) return;
  offset = clamp(now(), 0, DUR);
  playing = false;
  if (src) { try { src.stop(); } catch { } src.disconnect(); src = null; }
}
function seek(t) {
  const was = playing;
  pause();
  offset = clamp(t, 0, DUR);
  ended = offset >= DUR;
  started = true;
  if (was && !ended) play();
}
const toggle = () => (playing ? pause() : play());

// layout: fit a 16:9 stage into the window
let k = 1, ox = 0, oy = 0, dpr = 1;
function resize() {
  dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(innerWidth * dpr); cv.height = Math.round(innerHeight * dpr);
  k = Math.min(innerWidth / W, innerHeight / H);
  ox = (innerWidth - W * k) / 2; oy = (innerHeight - H * k) / 2;
}
addEventListener('resize', resize); resize();

function fmt(s) { s = Math.max(0, Math.floor(s)); return `0:${String(s).padStart(2, '0')}`; }
function drawOverlay(t) {
  if (qs.get('ui') === '0' && started) return;
  const big = !started || ended;
  if (big) {
    ctx.fillStyle = ended ? 'rgba(0,0,0,0.25)' : 'rgba(0,0,0,0.42)'; ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,0.18)'; circle(960, 540, 64); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = '#fff';
    if (ended) {
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(960, 540, 22, -Math.PI * 0.35, Math.PI * 1.45); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(975, 512); ctx.lineTo(979, 526); ctx.lineTo(965, 529); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.moveTo(946, 514); ctx.lineTo(946, 566); ctx.lineTo(990, 540); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    txt(ended ? T('重新播放', 'Replay') : T(`播放宣传片 · ${fmt(DUR)}`, `Play film · ${fmt(DUR)}`), 960, 650, { size: 26, weight: 600, color: '#fff' });
    return;
  }
  const show = !playing || performance.now() - lastMove < 2200;
  if (!show) return;
  const g = ctx.createLinearGradient(0, H - 150, 0, H);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.45)');
  ctx.fillStyle = g; ctx.fillRect(0, H - 150, W, 150);
  ctx.fillStyle = 'rgba(255,255,255,0.28)'; rr(80, 1036, W - 160, 6, 3); ctx.fill();
  ctx.fillStyle = '#fff'; rr(80, 1036, (W - 160) * clamp(t / DUR), 6, 3); ctx.fill();
  circle(80 + (W - 160) * clamp(t / DUR), 1039, 9); ctx.fill();
  txt(`${playing ? '❚❚' : '▶'}   ${fmt(t)} / ${fmt(DUR)}`, 80, 1010, { size: 22, weight: 600, color: '#fff', align: 'left' });
  txt(T('空格 播放/暂停 · ←→ 快进快退 · M 静音 · F 全屏 · L 语言', 'Space play/pause · ←→ seek · M mute · F fullscreen · L language'),
    W - 80, 1010, { size: 18, weight: 500, color: 'rgba(255,255,255,0.75)', align: 'right' });
}

function frame() {
  let t = now();
  if (playing && t >= DUR) {
    if (qs.get('loop') === '1') { pause(); offset = 0; play(); t = 0; }
    else { pause(); offset = DUR; ended = true; t = DUR; }
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(dpr * k, 0, 0, dpr * k, dpr * ox, dpr * oy);
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  drawFrame(started ? t : 50.6);
  drawOverlay(t);
  ctx.restore();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// input
const toStage = e => [(e.clientX - ox) / k, (e.clientY - oy) / k];
cv.addEventListener('mousemove', () => { lastMove = performance.now(); });
cv.addEventListener('click', e => {
  const [x, y] = toStage(e);
  if (started && !ended && y > 1010 && x >= 70 && x <= W - 70) { seek(((x - 80) / (W - 160)) * DUR); return; }
  if (ended) { offset = 0; ended = false; }
  toggle();
});
cv.addEventListener('dblclick', () => (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()));
addEventListener('keydown', e => {
  lastMove = performance.now();
  if (e.code === 'Space' || e.key === 'k') { e.preventDefault(); if (ended) { offset = 0; ended = false; } toggle(); }
  else if (e.key === 'ArrowRight') seek(now() + 3);
  else if (e.key === 'ArrowLeft') seek(now() - 3);
  else if (e.key === 'r' || e.key === 'Home') seek(0);
  else if (e.key === 'm') { muted = !muted; if (gainNode) gainNode.gain.value = muted ? 0 : 1; }
  else if (e.key === 'f') (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen());
  else if (e.key === 'l') { LANG = LANG === 'en' ? 'zh' : 'en'; document.documentElement.lang = LANG === 'en' ? 'en' : 'zh-CN'; }
});
if (qs.get('autoplay') === '1') play();

window.promo = { play, pause, seek, get time() { return now(); } };
</script>
